name: refresh profile

# Regenerates the profile artwork from live GitHub data and force-pushes the
# result to the orphan `output` branch. main only ever carries source, so the
# history a visitor sees stays human. Assumed, not verified: that this push
# counts as repository activity for GitHub's 60-idle-day schedule disable.
# Check that the schedule is still enabled around 2026-11-10.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, 17 past: off the hour to dodge the cron rush. GitHub delivers schedule events late and sometimes not at all for a fresh workflow; check the Actions tab for event=schedule runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: fetch data and render assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # optional: a fine-grained token of the owner (metadata read on all repos,
          # gists write). Unlocks the per-project split and the pinned gist.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          node scripts/fetch.mjs
          node scripts/render.mjs
          node scripts/lint.mjs
          node scripts/gist.mjs

      - name: publish to the output branch
        run: |
          # Commit as the actions bot, never as the profile owner: a commit
          # authored by him would count as a contribution and inflate the
          # very graph the README shows.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp assets/coach.svg assets/coach-narrow.svg assets/social.svg /tmp/out/
          cp data/profile.json /tmp/out/profile.json
          cd /tmp/out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "render: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output:output
        env:
          GITHUB_TOKEN: ${{ github.token }}
